<!DOCTYPE html>
<html lang="th">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบจัดการข้อมูลสมาชิก</title>
<script src="https://cdn.tailwindcss.com"></script>

<body class="bg-blue-50 p-2 sm:p-4 md:p-6 text-slate-800">
<div class="max-w-7xl mx-auto space-y-6">

<!-- ===== SUMMARY ===== -->
<div class="summary-grid grid grid-cols-2 md:grid-cols-4 gap-2 sm:gap-4 text-center">
  <div class="summary green">
    <div>สมาชิก</div>

  </div>

  <div class="summary purple">
    <div>สมาชิกสมทบ</div>

  </div>

  <div class="summary orange">
    <div>ลาออก</div>

  </div>

    <div id="count-dead" class="num">0</div>
  </div>

<!-- ===== FORM ===== -->
<form id="memberForm" class="box space-y-4">
<h2 class="title">บันทึกข้อมูลสมาชิก</h2>

<div class="member-form-grid grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-3">

  <div class="field"><label>วันที่สมัคร</label><input id="join_date" type="date"></div>
  <div class="field"><label>คำนำหน้า</label>
    <select id="title"><option value="">--</option><option>นาย</option><option>นาง</option><option>นางสาว</option></select>
  </div>
  <div class="field"><label>กลุ่ม</label><input id="group"></div>

  <div class="field"><label>ชื่อ</label><input id="first_name"></div>
  <div class="field"><label>นามสกุล</label><input id="last_name"></div>
  <div class="field"><label>เลขบัตรประชาชน</label><input id="id_card" type="number" inputmode="numeric" oninput="if(this.value.length > 13) this.value = this.value.slice(0,13)"></div>
  <div class="field"><label>วันเกิด</label><input id="birthday" type="date"></div>
  <div class="field"><label>เพศ</label>
    <select id="gender"><option value="">--</option><option>ชาย</option><option>หญิง</option></select>
  </div>
  <div class="field"><label>อายุ</label><input id="age" type="number"></div>

  <div class="field"><label>บ้านเลขที่</label><input id="house_no"></div>
  <div class="field"><label>หมู่</label><input id="moo"></div>
  <div class="field"><label>ถนน</label><input id="street"></div>
  <div class="field"><label>ซอย</label><input id="soi"></div>
  <div class="field"><label>หมู่บ้าน</label><input id="village"></div>

  <div class="field"><label>ตำบล</label><input id="subdistrict"></div>
  <div class="field"><label>อำเภอ</label><input id="district"></div>
  <div class="field"><label>จังหวัด</label><input id="province"></div>
  <div class="field"><label>รหัสไปรษณีย์</label><input id="postal_code"></div>

  <div class="field"><label>โทรศัพท์</label><input id="phone"></div>
  <div class="field"><label>โทรศัพท์สำรอง</label><input id="phone_alt"></div>

  <div class="field"><label>สถานะสมาชิก</label>
    <select id="member_status"><option value="">--</option><option>สมาชิก</option><option>สมาชิกสมทบ</option><option>ลาออก</option><option>เสียชีวิต</option></select>
  </div>

  <div class="field"><label>สถานภาพสมรส</label>
    <select id="marital_status"><option value="">--</option><option>โสด</option><option>สมรส</option></select>
  </div>

  <div class="field"><label>ชื่อคู่สมรส</label><input id="spouse_name"></div>
  <div class="field"><label>เป็นสมาชิก กยท.</label><input id="kyot_member"></div>
  <div class="field"><label>เลขสมาชิก กยท.</label><input id="kyot_member_id"></div>
  <div class="field"><label>ชื่อบิดา</label><input id="father_name"></div>
  <div class="field"><label>ชื่อมารดา</label><input id="mother_name"></div>
</div>

<div class="member-form-actions flex gap-3">
  <button class="btn blue" type="submit">💾 บันทึกข้อมูล</button>
  <button class="btn gray" type="button" onclick="resetForm()">ยกเลิก</button>
</div>
</form>

<!-- ===== BENEFICIARY PAGE ===== -->
<div class="box flex flex-col md:flex-row md:items-center md:justify-between gap-3">
  <div>
    <div class="font-bold text-emerald-700 text-lg">ผู้รับผลประโยชน์สมาชิก</div>
    <div class="text-sm text-slate-500">ค้นหาสมาชิก บันทึกหนังสือ และจัดสรรเปอร์เซ็นต์ผู้รับผลประโยชน์</div>

<!-- ===== FILTER + EXPORT ===== -->

<h2 class="title text-center">ค้นหา / Export</h2>

<div class="filter-grid grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">

  <input id="f_group" class="input" placeholder="กลุ่ม">
  <input id="f_phone" class="input" placeholder="เบอร์โทร">
  <select id="f_gender" class="input"><option value="">เพศ</option><option>ชาย</option><option>หญิง</option></select>
  <div class="status-filter input flex items-center gap-3 flex-wrap">
    <span class="font-medium whitespace-nowrap">สถานะ</span>
    <label class="flex items-center gap-1">
      <input type="checkbox" class="f-status" value="สมาชิก">
      สมาชิก
    </label>
    <label class="flex items-center gap-1">
      <input type="checkbox" class="f-status" value="สมาชิกสมทบ">
      สมาชิกสมทบ
    </label>
    <label class="flex items-center gap-1">
      <input type="checkbox" class="f-status" value="ลาออก">
      ลาออก
    </label>
    <label class="flex items-center gap-1">
      <input type="checkbox" class="f-status" value="เสียชีวิต">

  <input id="f_join_to" type="date" class="input" placeholder="วันที่สมัคร (ถึง)">

<div class="text-center">พบ <b><span id="resultCount">0</span></b> รายการ</div>

<!-- ===== TABLE ===== -->
<div class="box member-list-box">
<div class="member-table-wrap">
<table class="member-table w-full text-sm text-center">
<thead class="bg-blue-100">
<tr>
  <th>รหัส</th>
  <th>ชื่อ-นามสกุล</th>
  <th>กลุ่ม</th>
  <th>โทร</th>
  <th>เพศ</th>
  <th>สถานะ</th>

</div>

<div class="pagination flex justify-between items-center mt-4 gap-3">
  <button onclick="prevPage()" class="btn gray">◀</button>
  <span id="pageInfo"></span>
  <button onclick="nextPage()" class="btn gray">▶</button>
</div>
</div>

</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

const SUPABASE_URL = 'https://ttottijljxoinptmhgtu.supabase.co'
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR0b3R0aWpsanhvaW5wdG1oZ3R1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTgwMTYxODQsImV4cCI6MjA3MzU5MjE4NH0.XnIf3xLzSbZDwFVKWjLTCiF4jnnDMQ1W95EI-v6F-3Y'
const COOP_LOGO_URL = 'https://ttottijljxoinptmhgtu.supabase.co/storage/v1/object/public/slips/logo.png'
const db = createClient(SUPABASE_URL, SUPABASE_KEY)

const PAGE_SIZE = 15
let page = 1
let totalCount = 0
let debounceTimer = null
let editingMemberId = null

const form = document.getElementById('memberForm')
const rows = document.getElementById('rows')

const fMemberId = document.getElementById('f_member_id')
const fFirst = document.getElementById('f_first_name')
const fLast  = document.getElementById('f_last_name')
const fGroup = document.getElementById('f_group')
const fPhone = document.getElementById('f_phone')
const fGender= document.getElementById('f_gender')
const fStatus = document.querySelectorAll('.f-status')
const fJoinFrom = document.getElementById('f_join_from')

const fJoinTo   = document.getElementById('f_join_to')

function escapeHtml(value){
  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;')
}


function getCurrentFiscalYearThai(){
  const d=new Date()
  const y=d.getFullYear()
  const m=d.getMonth()+1
  return (m<4?y-1:y)+543
}

/* ===== SUBMIT (เพิ่ม error handling อย่างเดียว) ===== */
form.addEventListener('submit',async e=>{
  e.preventDefault()
  const data={}
  Array.from(form.elements).forEach(el=>{ if(el.id) data[el.id]=el.value||null })

  const { error } = await db.from('members').upsert([data],{onConflict:'member_id'})
  if(error){ alert(error.message); return }

  resetForm()
  loadMembers()
  loadSummary()
})

/* ===== AUTO FILTER / SEARCH ===== */
const searchInputs = [
  fMemberId,
  fFirst,
  fLast,
  fGroup,
  fPhone,
  fJoinFrom,
  fJoinTo
].filter(Boolean)

searchInputs.forEach(el=>{
  el.addEventListener('input',()=>{
    clearTimeout(debounceTimer)
    debounceTimer=setTimeout(()=>{
      page=1
      loadMembers()
    },350)
  })

  el.addEventListener('keydown',e=>{
    if(e.key === 'Enter'){
      e.preventDefault()
      clearTimeout(debounceTimer)
      page=1
      loadMembers()
    }
  })
})

if(fGender){
  fGender.addEventListener('change',()=>{
    page=1
    loadMembers()
  })
}

fStatus.forEach(el=>{
  el.addEventListener('change',()=>{
    page=1
    loadMembers()
  })
})

window.searchMembers = ()=>{
  clearTimeout(debounceTimer)
  page=1
  loadMembers()
}

window.resetForm = ()=>{
  form.reset()
  editingMemberId = null
  loadMembers()
}

window.clearFilters = ()=>{
  if(fMemberId) fMemberId.value=''
  if(fFirst) fFirst.value=''
  if(fLast) fLast.value=''
  if(fGroup) fGroup.value=''
  if(fPhone) fPhone.value=''
  if(fGender) fGender.value=''
  fStatus.forEach(el => el.checked = false)
  if(fJoinFrom) fJoinFrom.value=''
  if(fJoinTo) fJoinTo.value=''
  page=1
  loadMembers()
}



/* ===== SUMMARY ===== */
async function loadSummary(){
  document.getElementById('count-member').innerText =
    (await db.from('members')
      .select('member_id',{count:'exact',head:true})
      .eq('member_status','สมาชิก')
    ).count || 0

  document.getElementById('count-associate').innerText =
    (await db.from('members')
      .select('member_id',{count:'exact',head:true})
      .eq('member_status','สมาชิกสมทบ')
    ).count || 0

  document.getElementById('count-resign').innerText =
    (await db.from('members')
      .select('member_id',{count:'exact',head:true})
      .eq('member_status','ลาออก')
    ).count || 0

  document.getElementById('count-dead').innerText =
    (await db.from('members')
      .select('member_id',{count:'exact',head:true})
      .eq('member_status','เสียชีวิต')
    ).count || 0
}




/* ===== LOAD MEMBERS ===== */

async function loadMembers(){
  try{
    const memberId = (fMemberId?.value || '').trim()
    const firstName = (fFirst?.value || '').trim()
    const lastName = (fLast?.value || '').trim()
    const groupValue = (fGroup?.value || '').trim()
    const phoneValue = (fPhone?.value || '').trim()
    const genderValue = fGender?.value || ''
    const joinFromValue = fJoinFrom?.value || ''
    const joinToValue = fJoinTo?.value || ''

    let q=db.from('members')
      .select('member_id,title,first_name,last_name,group,phone,gender,member_status',{count:'exact'})
      .order('member_id')

    // member_id ในฐานข้อมูลเป็น text → ใช้ ilike เพื่อค้นหาได้ทั้งเต็มรหัสและบางส่วน
    if(memberId) q=q.ilike('member_id','%'+memberId+'%')
    if(firstName) q=q.ilike('first_name','%'+firstName+'%')
    if(lastName) q=q.ilike('last_name','%'+lastName+'%')
    if(groupValue) q=q.ilike('group','%'+groupValue+'%')
    if(phoneValue) q=q.ilike('phone','%'+phoneValue+'%')
    if(genderValue) q=q.eq('gender',genderValue)

    const selectedStatus = [...fStatus]
      .filter(el => el.checked)
      .map(el => el.value)

    if(selectedStatus.length) q=q.in('member_status', selectedStatus)
    if(joinFromValue) q=q.gte('join_date', joinFromValue)
    if(joinToValue) q=q.lte('join_date', joinToValue)

    const from=(page-1)*PAGE_SIZE
    const to=from+PAGE_SIZE-1
    const {data,count,error}=await q.range(from,to)

    if(error) throw error

    totalCount=count||0

    const resultCountEl = document.getElementById('resultCount')
    const pageInfoEl = document.getElementById('pageInfo')
    if(resultCountEl) resultCountEl.innerText=totalCount.toLocaleString('th-TH')
    if(pageInfoEl){
      pageInfoEl.innerText=
        `หน้า ${page} / ${Math.max(1,Math.ceil(totalCount/PAGE_SIZE))}`
    }

    if(!rows) return

    if(!data || data.length === 0){
      rows.innerHTML = `
        <tr class="member-row">
          <td colspan="7" class="p-6 text-center text-slate-500">
            ไม่พบข้อมูลสมาชิกตามเงื่อนไขที่ค้นหา
          </td>
        </tr>`
      return
    }

    rows.innerHTML = data.map(m=>{
      const id = escapeHtml(m.member_id)
      const fullName = `${escapeHtml(m.title||'')}${escapeHtml(m.first_name||'')} ${escapeHtml(m.last_name||'')}`.trim()

      return `
<tr class="member-row border-b hover:bg-blue-50">
<td data-label="รหัสสมาชิก">${id}</td>
<td data-label="ชื่อ-นามสกุล">
  <button type="button"
          class="link member-name-link text-left"
          data-member-id="${id}"
          onclick="viewMember(this.dataset.memberId)">
    ${fullName || '-'}
  </button>
</td>

<td data-label="กลุ่ม">${escapeHtml(m.group||'-')}</td>
<td data-label="โทร">${escapeHtml(m.phone||'-')}</td>
<td data-label="เพศ">${escapeHtml(m.gender||'-')}</td>
<td data-label="สถานะ"><span class="member-status-badge">${escapeHtml(m.member_status||'-')}</span></td>
<td data-label="จัดการ" class="member-actions-cell">
  <div class="member-row-actions">
    <button type="button"
            class="mobile-action benefit"
            data-member-id="${id}"
            onclick="openBeneficiary(this.dataset.memberId)">👥 ผู้รับผลประโยชน์</button>
    <button type="button"
            class="mobile-action edit"
            data-member-id="${id}"
            onclick="editMember(this.dataset.memberId)">✏️ แก้ไข</button>
    <button type="button"
            class="mobile-action delete"
            data-member-id="${id}"
            onclick="deleteMember(this.dataset.memberId)">🗑️ ลบ</button>
  </div>
</td>
</tr>`
    }).join('')

  }catch(err){
    console.error('loadMembers error:', err)

    const resultCountEl = document.getElementById('resultCount')
    const pageInfoEl = document.getElementById('pageInfo')

    if(resultCountEl) resultCountEl.innerText='0'
    if(pageInfoEl) pageInfoEl.innerText='โหลดข้อมูลไม่สำเร็จ'

    if(rows){
      rows.innerHTML = `
        <tr class="member-row">
          <td colspan="7" class="p-5 text-center text-red-600">
            โหลดข้อมูลสมาชิกไม่สำเร็จ: ${escapeHtml(err?.message || err)}
          </td>
        </tr>`
    }
  }
}

/* ===== BENEFICIARY ===== */
window.openBeneficiary = id=>{
  const memberId = String(id ?? '').trim()
  if(!memberId) return
  window.location.href = `beneficiary.html?member_id=${encodeURIComponent(memberId)}`
}

/* ===== EDIT / DELETE ===== */
window.editMember = async id=>{
  if(!(await window.checkPassword())) return

  const memberId = String(id ?? '').trim()
  if(!memberId) return

  editingMemberId = memberId
  const {data,error}=await db.from('members')
    .select('*')
    .eq('member_id',memberId)
    .single()

  if(error || !data){
    Swal.fire('โหลดข้อมูลไม่สำเร็จ', error?.message || 'ไม่พบข้อมูลสมาชิก', 'error')
    return
  }

  Array.from(form.elements).forEach(el=>{
    if(el.id) el.value = data[el.id] ?? ''
  })

  form.scrollIntoView({behavior:'smooth', block:'start'})
}


window.deleteMember = async id=>{
  if(!(await window.checkPassword())) return

  const memberId = String(id ?? '').trim()
  if(!memberId) return

  if(!confirm('ยืนยันการลบสมาชิก รหัส '+memberId)) return

  const {error} = await db.from('members').delete().eq('member_id',memberId)

  if(error){
    Swal.fire('ลบไม่สำเร็จ', error.message, 'error')
    return
  }

  editingMemberId = null
  loadMembers()
  loadSummary()
}
  // กดชื่อดูรายละเอียดสมาชิก

window.exportExcel = async ()=>{
  let q = db.from('members').select('*')

  // ✅ FILTER ต้องมาก่อน
  if(fMemberId.value) q=q.eq('member_id',fMemberId.value)
  if(fFirst.value)    q=q.ilike('first_name','%'+fFirst.value+'%')
  if(fLast.value)     q=q.ilike('last_name','%'+fLast.value+'%')
  if(fGroup.value)    q=q.ilike('group','%'+fGroup.value+'%')
  if(fPhone.value)    q=q.ilike('phone','%'+fPhone.value+'%')
  if(fGender.value)   q=q.eq('gender',fGender.value)
  const selectedStatus = [...fStatus]
    .filter(el => el.checked)
    .map(el => el.value)

  if(selectedStatus.length) q=q.in('member_status', selectedStatus)

  // ✅ BETWEEN วันที่สมัคร
  if(fJoinFrom.value) q=q.gte('join_date', fJoinFrom.value)
  if(fJoinTo.value)   q=q.lte('join_date', fJoinTo.value)

  // ✅ order ไว้ท้าย
  q = q.order('member_id')

  const { data, error } = await q
  if(error){ alert(error.message); return }
  if(!data || !data.length){
    alert('ไม่มีข้อมูลให้ export')
    return
  }

  const ws = XLSX.utils.json_to_sheet(data)
  const wb = XLSX.utils.book_new()
  XLSX.utils.book_append_sheet(wb, ws, 'สมาชิก')
  XLSX.writeFile(wb, 'รายชื่อสมาชิก.xlsx')
}

window.printMemberReport = async ()=>{
  const pageSize = 1000

      .select('member_id,title,first_name,last_name,group,id_card,house_no,moo,street,soi,village,subdistrict,district,province,postal_code,member_status')

    if(fMemberId.value) q=q.eq('member_id',fMemberId.value)
    if(fFirst.value)    q=q.ilike('first_name','%'+fFirst.value+'%')
    if(fLast.value)     q=q.ilike('last_name','%'+fLast.value+'%')
