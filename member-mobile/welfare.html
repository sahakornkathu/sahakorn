<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>สวัสดิการสมาชิก</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#166534">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./mobile.css">
<style>body{margin:0;padding:8px;background:#0f172a;color:#e2e8f0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.mobile-nav{background:#111827;border-color:#334155;color:#f8fafc}.mobile-nav a{background:#1e293b;color:#fff}.mobile-nav .nav-sub{color:#94a3b8}.dark-card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:14px}.dark-grid{display:grid;grid-template-columns:1fr;gap:10px}.dark-field{display:grid;gap:5px}.dark-field label{font-size:14px;font-weight:750;color:#cbd5e1}.dark-input{width:100%;min-height:48px;padding:10px 12px;border:1px solid #475569;border-radius:10px;background:#020617;color:#fff}.dark-title{font-size:19px;font-weight:850;margin:0 0 12px;color:#4ade80}.dark-row{background:#111827;border:1px solid #334155;border-radius:13px;padding:12px}.dark-list{display:grid;gap:10px}.dark-kv{display:grid;grid-template-columns:105px 1fr;gap:7px;padding:4px 0;font-size:15px}.dark-kv b{color:#94a3b8;font-size:13px}@media(min-width:700px){.dark-grid{grid-template-columns:1fr 1fr}}</style></head><body><nav class="mobile-nav"><a href="index.html" aria-label="หน้าแรก">⌂<span class="nav-home-text">หน้าแรก</span></a><div class="nav-text"><div class="nav-title">สวัสดิการสมาชิก</div><div class="nav-sub">ระบบสมาชิก • มือถือ</div></div></nav><main style="display:grid;gap:12px;max-width:760px;margin:auto"><section class="dark-card"><h1 class="dark-title">บันทึกสวัสดิการ</h1><form id="form" class="dark-grid"><div class="dark-field"><label>รหัสสมาชิก</label><input id="member_id" class="dark-input" inputmode="numeric" required></div><div class="dark-field"><label>ชื่อสมาชิก</label><input id="member_name" class="dark-input" readonly></div><div class="dark-field"><label>กลุ่ม</label><input id="group" class="dark-input" readonly></div><div class="dark-field"><label>วันที่รับสวัสดิการ</label><input id="receive_date" type="date" class="dark-input" required></div><div class="dark-field"><label>จำนวนเงิน</label><select id="amount" class="dark-input" required><option value="">-- เลือก --</option><option value="500">500</option><option value="2000">2,000</option><option value="5000">5,000</option></select></div><div class="dark-field"><label>หมายเหตุ</label><select id="remark" class="dark-input" required><option value="">-- เลือก --</option><option>ตนเองเสียชีวิต</option><option>บิดาเสียชีวิต</option><option>มารดาเสียชีวิต</option><option>คู่สมรสเสียชีวิต</option><option>รักษาพยาบาล</option></select></div><div class="dark-field" style="grid-column:1/-1"><label>บันทึกเพิ่มเติม</label><textarea id="note" class="dark-input" style="min-height:90px"></textarea></div><div class="mobile-actions" style="grid-column:1/-1"><button class="mobile-btn primary" type="submit">บันทึก</button><button id="clearEditBtn" class="mobile-btn gray" type="button">ล้างฟอร์ม</button></div></form></section><section class="dark-card"><h2 class="dark-title" style="color:#38bdf8">ค้นหา / กรอง</h2><div class="dark-grid"><div class="dark-field"><label>รหัสสมาชิก</label><input id="f_member_id" class="dark-input"></div><div class="dark-field"><label>กลุ่ม</label><input id="f_group" class="dark-input"></div><div class="dark-field"><label>หมายเหตุ</label><select id="f_remark" class="dark-input"><option value="">ทั้งหมด</option><option>ตนเองเสียชีวิต</option><option>บิดาเสียชีวิต</option><option>มารดาเสียชีวิต</option><option>คู่สมรสเสียชีวิต</option><option>รักษาพยาบาล</option></select></div><div class="dark-field"><label>วันที่จาก</label><input id="f_from" type="date" class="dark-input"></div><div class="dark-field"><label>วันที่ถึง</label><input id="f_to" type="date" class="dark-input"></div></div><div class="mobile-filter-actions" style="margin-top:10px"><button id="clearFilterBtn" class="mobile-btn gray">ล้างกรอง</button><button id="exportBtn" class="mobile-btn primary">Export Excel</button><button id="printBtn" class="mobile-btn blue">พิมพ์</button></div></section><section class="dark-card"><h2 class="dark-title" style="color:#fb923c">รายการสวัสดิการ <span id="resultCount">0</span> รายการ</h2><div id="rows" class="dark-list"></div><div class="mobile-actions" style="margin-top:12px"><button id="prevBtn" class="mobile-btn gray">ก่อนหน้า</button><button id="nextBtn" class="mobile-btn gray">ถัดไป</button></div><div id="pageInfo" style="text-align:center;margin-top:8px;color:#94a3b8"></div></section></main><script type="module">import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';const db=createClient("https://ttottijljxoinptmhgtu.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR0b3R0aWpsanhvaW5wdG1oZ3R1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTgwMTYxODQsImV4cCI6MjA3MzU5MjE4NH0.XnIf3xLzSbZDwFVKWjLTCiF4jnnDMQ1W95EI-v6F-3Y"),$=id=>document.getElementById(id);let all=[],page=1,size=10,editId=null,member=null;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function lookup(){const id=$('member_id').value.trim();if(!id)return;const r=await db.from('members').select('member_id,title,first_name,last_name,group').eq('member_id',id).maybeSingle();if(!r.data){member=null;$('member_name').value='';$('group').value='';Swal.fire('ไม่พบสมาชิก','','warning');return}member=r.data;$('member_name').value=`${member.title||''}${member.first_name||''} ${member.last_name||''}`;$('group').value=member.group||''}$('member_id').addEventListener('blur',lookup);function clearEdit(){editId=null;member=null;$('form').reset();$('member_name').value='';$('group').value=''}$('clearEditBtn').onclick=clearEdit;$('form').onsubmit=async e=>{e.preventDefault();if(!member)await lookup();if(!member)return;const payload={member_id:String($('member_id').value.trim()),receive_date:$('receive_date').value,amount:Number($('amount').value),remark:$('remark').value,note:$('note').value||null};let error;if(editId)({error}=await db.from('welfare').update(payload).eq('id',editId));else{const chk=await db.from('welfare').select('id').eq('member_id',payload.member_id).eq('remark',payload.remark).maybeSingle();if(chk.data){Swal.fire('บันทึกซ้ำไม่ได้','กรณีนี้มีข้อมูลแล้ว','warning');return}({error}=await db.from('welfare').insert([payload]))}if(error){Swal.fire('บันทึกไม่สำเร็จ',error.message,'error');return}Swal.fire('สำเร็จ','','success');clearEdit();load()};async function load(){let q=db.from('welfare').select('*, members(title,first_name,last_name,group)').order('created_at',{ascending:false});if($('f_member_id').value)q=q.ilike('member_id','%'+$('f_member_id').value.trim()+'%');if($('f_remark').value)q=q.eq('remark',$('f_remark').value);if($('f_from').value)q=q.gte('receive_date',$('f_from').value);if($('f_to').value)q=q.lte('receive_date',$('f_to').value);const r=await q;if(r.error){Swal.fire('โหลดข้อมูลไม่สำเร็จ',r.error.message,'error');return}all=(r.data||[]).filter(x=>!$('f_group').value||String(x.members?.group||'').includes($('f_group').value));page=1;render()}function render(){$('resultCount').textContent=all.length;const arr=all.slice((page-1)*size,page*size);$('rows').innerHTML=arr.length?arr.map((r,i)=>`<div class="dark-row"><div class="dark-kv"><b>รหัส</b><span>${esc(r.member_id)}</span></div><div class="dark-kv"><b>ชื่อ</b><span>${esc((r.members?.title||'')+(r.members?.first_name||'')+' '+(r.members?.last_name||''))}</span></div><div class="dark-kv"><b>กลุ่ม</b><span>${esc(r.members?.group||'-')}</span></div><div class="dark-kv"><b>วันที่รับ</b><span>${esc(r.receive_date||'-')}</span></div><div class="dark-kv"><b>จำนวนเงิน</b><span>${Number(r.amount||0).toLocaleString('th-TH')} บาท</span></div><div class="dark-kv"><b>หมายเหตุ</b><span>${esc(r.remark||'-')}</span></div><div class="mobile-row-actions"><button style="background:#2563eb;color:white" onclick="editRow(${(page-1)*size+i})">แก้ไข</button><button style="background:#dc2626;color:white" onclick="delRow(${(page-1)*size+i})">ลบ</button></div></div>`).join(''):'<div class="mobile-empty">ไม่พบข้อมูล</div>';$('pageInfo').textContent=`หน้า ${page} / ${Math.max(1,Math.ceil(all.length/size))}`}window.editRow=i=>{const r=all[i];editId=r.id;member={member_id:r.member_id,title:r.members?.title||'',first_name:r.members?.first_name||'',last_name:r.members?.last_name||'',group:r.members?.group||''};$('member_id').value=r.member_id;$('member_name').value=`${member.title}${member.first_name} ${member.last_name}`;$('group').value=member.group;$('receive_date').value=r.receive_date||'';$('amount').value=r.amount||'';$('remark').value=r.remark||'';$('note').value=r.note||'';scrollTo({top:0,behavior:'smooth'})};window.delRow=async i=>{const r=all[i],ok=await Swal.fire({title:'ยืนยันการลบ?',showCancelButton:true,confirmButtonText:'ลบ'});if(!ok.isConfirmed)return;const d=await db.from('welfare').delete().eq('id',r.id);if(d.error)Swal.fire('ลบไม่สำเร็จ',d.error.message,'error');else load()};['f_member_id','f_group','f_remark','f_from','f_to'].forEach(id=>$(id).addEventListener('input',()=>{clearTimeout(window._w);window._w=setTimeout(load,250)}));$('clearFilterBtn').onclick=()=>{['f_member_id','f_group','f_remark','f_from','f_to'].forEach(id=>$(id).value='');load()};$('prevBtn').onclick=()=>{if(page>1){page--;render()}};$('nextBtn').onclick=()=>{if(page*size<all.length){page++;render()}};$('exportBtn').onclick=()=>{if(!all.length)return;const data=all.map(r=>({member_id:r.member_id,name:(r.members?.title||'')+(r.members?.first_name||'')+' '+(r.members?.last_name||''),group:r.members?.group||'',receive_date:r.receive_date,amount:r.amount,remark:r.remark,note:r.note||''}));const ws=XLSX.utils.json_to_sheet(data),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'สวัสดิการ');XLSX.writeFile(wb,'รายงานสวัสดิการสมาชิก.xlsx')};$('printBtn').onclick=()=>window.print();load();</script></body></html>
