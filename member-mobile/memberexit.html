<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>สมาชิกลาออก / เสียชีวิต</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#166534">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./mobile.css">
<style>body{margin:0;padding:8px;background:#0f172a;color:#e2e8f0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.mobile-nav{background:#111827;border-color:#334155;color:#f8fafc}.mobile-nav a{background:#1e293b;color:#fff}.mobile-nav .nav-sub{color:#94a3b8}.dark-card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:14px;box-shadow:0 5px 18px rgba(0,0,0,.15)}.dark-grid{display:grid;grid-template-columns:1fr;gap:10px}.dark-field{display:grid;gap:5px}.dark-field label{font-size:14px;font-weight:750;color:#cbd5e1}.dark-input{width:100%;min-height:48px;padding:10px 12px;border:1px solid #475569;border-radius:10px;background:#020617;color:#fff;outline:none}.dark-title{font-size:19px;font-weight:850;margin:0 0 12px;color:#fbbf24}.dark-list{display:grid;gap:10px}.dark-row{background:#111827;border:1px solid #334155;border-radius:13px;padding:12px}.dark-kv{display:grid;grid-template-columns:100px 1fr;gap:7px;padding:4px 0;font-size:15px}.dark-kv b{color:#94a3b8;font-size:13px}.dark-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.dark-actions button{min-height:44px;border:0;border-radius:9px;font-weight:800}@media(min-width:700px){.dark-grid{grid-template-columns:1fr 1fr}}</style></head><body><nav class="mobile-nav"><a href="index.html" aria-label="หน้าแรก">⌂<span class="nav-home-text">หน้าแรก</span></a><div class="nav-text"><div class="nav-title">สมาชิกลาออก / เสียชีวิต</div><div class="nav-sub">ระบบสมาชิก • มือถือ</div></div></nav><main style="display:grid;gap:12px;max-width:760px;margin:auto"><section class="dark-card"><h1 class="dark-title">บันทึกลาออก / เสียชีวิต</h1><form id="exitForm" class="dark-grid"><div class="dark-field"><label>รหัสสมาชิก</label><input id="member_id" class="dark-input" inputmode="numeric" required></div><div class="dark-field"><label>ชื่อสมาชิก</label><input id="member_name" class="dark-input" readonly></div><div class="dark-field"><label>กลุ่ม</label><input id="group" class="dark-input" readonly></div><div class="dark-field"><label>สถานะ</label><select id="member_status" class="dark-input" required><option value="">-- เลือก --</option><option>ลาออก</option><option>เสียชีวิต</option></select></div><div class="dark-field"><label>วันที่ประชุม</label><input id="meeting_date" type="date" class="dark-input" required></div><div class="dark-field"><label>หุ้นคงเหลือ</label><input id="share_amount" type="number" step="0.01" class="dark-input"></div><div class="dark-field"><label>วันที่รับเงิน</label><input id="receive_date" type="date" class="dark-input"></div><div class="mobile-actions" style="grid-column:1/-1"><button class="mobile-btn red" type="submit">บันทึก</button><button class="mobile-btn gray" type="button" id="clearEditBtn">ล้างฟอร์ม</button></div></form></section><section class="dark-card"><h2 class="dark-title" style="color:#38bdf8">ค้นหา / กรอง</h2><div class="dark-grid"><div class="dark-field"><label>รหัสสมาชิก</label><input id="f_member_id" class="dark-input"></div><div class="dark-field"><label>ชื่อ</label><input id="f_name" class="dark-input"></div><div class="dark-field"><label>กลุ่ม</label><input id="f_group" class="dark-input"></div><div class="dark-field"><label>สถานะ</label><select id="f_status" class="dark-input"><option value="">ทั้งหมด</option><option>ลาออก</option><option>เสียชีวิต</option></select></div><div class="dark-field"><label>วันที่จาก</label><input id="f_from" type="date" class="dark-input"></div><div class="dark-field"><label>วันที่ถึง</label><input id="f_to" type="date" class="dark-input"></div></div><div class="mobile-filter-actions" style="margin-top:10px"><button id="clearFilterBtn" class="mobile-btn gray">ล้างกรอง</button><button id="exportBtn" class="mobile-btn primary">Export Excel</button><button id="printBtn" class="mobile-btn blue">พิมพ์</button></div></section><section class="dark-card"><h2 class="dark-title" style="color:#fb923c">รายการย้อนหลัง <span id="resultCount">0</span> รายการ</h2><div id="rows" class="dark-list"></div><div class="mobile-actions" style="margin-top:12px"><button id="prevBtn" class="mobile-btn gray">ก่อนหน้า</button><button id="nextBtn" class="mobile-btn gray">ถัดไป</button></div><div id="pageInfo" style="text-align:center;margin-top:8px;color:#94a3b8"></div></section></main><script type="module">import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';const db=createClient("https://ttottijljxoinptmhgtu.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR0b3R0aWpsanhvaW5wdG1oZ3R1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTgwMTYxODQsImV4cCI6MjA3MzU5MjE4NH0.XnIf3xLzSbZDwFVKWjLTCiF4jnnDMQ1W95EI-v6F-3Y");const $=id=>document.getElementById(id);let all=[],page=1,size=10,editing=null,memberCache=null;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function lookup(){const id=$('member_id').value.trim();if(!id)return;const {data,error}=await db.from('members').select('member_id,title,first_name,last_name,group').eq('member_id',id).maybeSingle();if(error||!data){memberCache=null;$('member_name').value='';$('group').value='';Swal.fire('ไม่พบสมาชิก','','warning');return}memberCache=data;$('member_name').value=`${data.title||''}${data.first_name||''} ${data.last_name||''}`;$('group').value=data.group||''}$('member_id').addEventListener('blur',lookup);function clearEdit(){editing=null;memberCache=null;$('exitForm').reset();$('member_name').value='';$('group').value=''}$('clearEditBtn').onclick=clearEdit;$('exitForm').onsubmit=async e=>{e.preventDefault();if(!memberCache)await lookup();if(!memberCache)return;const payload={member_id:String($('member_id').value.trim()),title:memberCache.title||'',first_name:memberCache.first_name||'',last_name:memberCache.last_name||'',group:memberCache.group||'',member_status:$('member_status').value,meeting_date:$('meeting_date').value,share_amount:$('share_amount').value||null,receive_date:$('receive_date').value||null};let error;if(editing)({error}=await db.from('member_exit').update(payload).eq('member_id',editing.member_id).eq('meeting_date',editing.meeting_date));else{const chk=await db.from('member_exit').select('member_id').eq('member_id',payload.member_id).eq('meeting_date',payload.meeting_date).maybeSingle();if(chk.data){Swal.fire('รายการซ้ำ','สมาชิกมีข้อมูลวันที่ประชุมนี้แล้ว','warning');return}({error}=await db.from('member_exit').insert([payload]))}if(error){Swal.fire('บันทึกไม่สำเร็จ',error.message,'error');return}await db.from('members').update({member_status:payload.member_status}).eq('member_id',payload.member_id);Swal.fire('สำเร็จ','','success');clearEdit();load()};async function load(){let q=db.from('member_exit').select('*').order('meeting_date',{ascending:false});if($('f_member_id').value)q=q.ilike('member_id','%'+$('f_member_id').value.trim()+'%');if($('f_group').value)q=q.ilike('group','%'+$('f_group').value.trim()+'%');if($('f_status').value)q=q.eq('member_status',$('f_status').value);if($('f_from').value)q=q.gte('meeting_date',$('f_from').value);if($('f_to').value)q=q.lte('meeting_date',$('f_to').value);const {data,error}=await q;if(error){Swal.fire('โหลดข้อมูลไม่สำเร็จ',error.message,'error');return}all=(data||[]).filter(r=>!$('f_name').value||(`${r.first_name||''} ${r.last_name||''}`).toLowerCase().includes($('f_name').value.toLowerCase()));page=1;render()}function render(){$('resultCount').textContent=all.length;const slice=all.slice((page-1)*size,page*size);$('rows').innerHTML=slice.length?slice.map((r,i)=>`<div class="dark-row"><div class="dark-kv"><b>รหัส</b><span>${esc(r.member_id)}</span></div><div class="dark-kv"><b>ชื่อ</b><span>${esc((r.title||'')+(r.first_name||'')+' '+(r.last_name||''))}</span></div><div class="dark-kv"><b>กลุ่ม</b><span>${esc(r.group||'-')}</span></div><div class="dark-kv"><b>สถานะ</b><span>${esc(r.member_status||'-')}</span></div><div class="dark-kv"><b>ประชุม</b><span>${esc(r.meeting_date||'-')}</span></div><div class="dark-kv"><b>หุ้น</b><span>${esc(r.share_amount||'-')}</span></div><div class="dark-kv"><b>รับเงิน</b><span>${esc(r.receive_date||'-')}</span></div><div class="dark-actions"><button style="background:#2563eb;color:white" onclick="editRow(${(page-1)*size+i})">แก้ไข</button><button style="background:#dc2626;color:white" onclick="delRow(${(page-1)*size+i})">ลบ</button></div></div>`).join(''):'<div class="mobile-empty">ไม่พบข้อมูล</div>';$('pageInfo').textContent=`หน้า ${page} / ${Math.max(1,Math.ceil(all.length/size))}`}window.editRow=i=>{const r=all[i];editing={member_id:r.member_id,meeting_date:r.meeting_date};memberCache={title:r.title,first_name:r.first_name,last_name:r.last_name,group:r.group};$('member_id').value=r.member_id;$('member_name').value=`${r.title||''}${r.first_name||''} ${r.last_name||''}`;$('group').value=r.group||'';$('member_status').value=r.member_status||'';$('meeting_date').value=r.meeting_date||'';$('share_amount').value=r.share_amount||'';$('receive_date').value=r.receive_date||'';scrollTo({top:0,behavior:'smooth'})};window.delRow=async i=>{const r=all[i];const ok=await Swal.fire({title:'ยืนยันการลบ?',showCancelButton:true,confirmButtonText:'ลบ',cancelButtonText:'ยกเลิก'});if(!ok.isConfirmed)return;const {error}=await db.from('member_exit').delete().eq('member_id',r.member_id).eq('meeting_date',r.meeting_date);if(error){Swal.fire('ลบไม่สำเร็จ',error.message,'error');return}const latest=await db.from('member_exit').select('member_status').eq('member_id',r.member_id).order('meeting_date',{ascending:false}).limit(1);await db.from('members').update({member_status:latest.data?.[0]?.member_status||'สมาชิก'}).eq('member_id',r.member_id);load()};['f_member_id','f_name','f_group','f_status','f_from','f_to'].forEach(id=>$(id).addEventListener('input',()=>{clearTimeout(window._t);window._t=setTimeout(load,250)}));$('clearFilterBtn').onclick=()=>{['f_member_id','f_name','f_group','f_status','f_from','f_to'].forEach(id=>$(id).value='');load()};$('prevBtn').onclick=()=>{if(page>1){page--;render()}};$('nextBtn').onclick=()=>{if(page*size<all.length){page++;render()}};$('exportBtn').onclick=()=>{if(!all.length)return;const ws=XLSX.utils.json_to_sheet(all);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'ลาออก-เสียชีวิต');XLSX.writeFile(wb,'สมาชิกลาออก-เสียชีวิต.xlsx')};$('printBtn').onclick=()=>window.print();load();</script></body></html>
