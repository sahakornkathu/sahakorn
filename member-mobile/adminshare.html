<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ลงหุ้นสมาชิก</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#166534">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./mobile.css">
<style>body{margin:0;padding:8px;background:#eef2f7;color:#17231e;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:760px;margin:auto;display:grid;gap:12px}.share-card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:14px;box-shadow:0 5px 18px rgba(15,23,42,.06)}.share-title{font-size:19px;font-weight:850;margin:0 0 12px;color:#166534}.report-list{display:grid;gap:8px}.report-row{border:1px solid #e2e8f0;border-radius:12px;padding:10px;background:#f8fafc}.report-kv{display:flex;justify-content:space-between;gap:12px;padding:3px 0;font-size:14px}.report-kv span:first-child{color:#64748b}.amount-pos{color:#15803d;font-weight:800}.amount-neg{color:#dc2626;font-weight:800}</style></head><body><nav class="mobile-nav"><a href="index.html" aria-label="หน้าแรก">⌂<span class="nav-home-text">หน้าแรก</span></a><div class="nav-text"><div class="nav-title">ลงหุ้นสมาชิก</div><div class="nav-sub">ระบบสมาชิก • มือถือ</div></div></nav><main><section class="share-card"><h1 class="share-title">ค้นหาสมาชิก</h1><div class="mobile-field"><label>รหัสสมาชิก</label><input id="member_id" class="mobile-input" inputmode="numeric" placeholder="กรอกรหัสสมาชิก"></div><button id="loadBtn" class="mobile-btn primary" style="margin-top:10px">โหลดข้อมูล</button></section><section id="memberBox"></section><section id="formBox"></section><section class="share-card"><h2 class="share-title">รายการหุ้น</h2><div class="mobile-field"><label>ปีบัญชี</label><select id="yearFilter" class="mobile-input"><option value="all">ทุกปี</option></select></div><div id="reportBox" class="report-list" style="margin-top:10px"></div></section><section class="share-card"><h2 class="share-title">รายงานซื้อหุ้นประจำวัน</h2><div class="mobile-field"><label>เลือกวันที่</label><input type="date" id="dailyDate" class="mobile-input"></div><div id="dailyReport" class="report-list" style="margin-top:10px"></div></section></main><script>const sb=window.supabase.createClient("https://ttottijljxoinptmhgtu.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR0b3R0aWpsanhvaW5wdG1oZ3R1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTgwMTYxODQsImV4cCI6MjA3MzU5MjE4NH0.XnIf3xLzSbZDwFVKWjLTCiF4jnnDMQ1W95EI-v6F-3Y"),$=id=>document.getElementById(id);let member=null;const money=v=>Number(v||0).toLocaleString('th-TH',{minimumFractionDigits:0,maximumFractionDigits:2});function thaiToISO(v){const p=v.split('/');if(p.length!==3)return null;return `${Number(p[2])-543}-${String(p[1]).padStart(2,'0')}-${String(p[0]).padStart(2,'0')}`}function isoToThai(v){if(!v)return'-';const [y,m,d]=v.split('-').map(Number);return `${String(d).padStart(2,'0')}/${String(m).padStart(2,'0')}/${y+543}`}function todayThai(){const d=new Date();return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()+543}`}function fy(iso){const d=new Date(iso);const y=d.getFullYear()+543,m=d.getMonth()+1;return m>=4?y:y-1}$('loadBtn').onclick=loadMember;$('member_id').addEventListener('keydown',e=>{if(e.key==='Enter')loadMember()});async function loadMember(){const id=$('member_id').value.trim();const r=await sb.from('members').select('*').eq('member_id',id).maybeSingle();if(!r.data){Swal.fire('ไม่พบสมาชิก','','error');return}member=r.data;$('memberBox').innerHTML=`<div class="share-card"><h2 class="share-title">ข้อมูลสมาชิก</h2><div class="mobile-kv"><span>รหัส</span><span>${member.member_id}</span></div><div class="mobile-kv"><span>ชื่อ</span><span>${member.title||''}${member.first_name||''} ${member.last_name||''}</span></div><div class="mobile-kv"><span>กลุ่ม</span><span>${member.group||'-'}</span></div></div>`;$('formBox').innerHTML=`<div class="share-card"><h2 class="share-title">บันทึกซื้อ / ขายหุ้น</h2><div class="mobile-field"><label>วันที่ (พ.ศ.)</label><input id="date" class="mobile-input" value="${todayThai()}"></div><div class="mobile-grid two" style="margin-top:10px"><div class="mobile-field"><label>ซื้อหุ้น</label><input id="buy" type="number" step="0.01" class="mobile-input"></div><div class="mobile-field"><label>ขายหุ้น</label><input id="sell" type="number" step="0.01" class="mobile-input"></div></div><button class="mobile-btn primary" style="margin-top:10px" onclick="saveShare()">บันทึก</button></div>`;await loadYearFilter();await loadReport()}async function loadYearFilter(){if(!member)return;const r=await sb.from('member_share_tx').select('fiscal_year').eq('member_id',Number(member.member_id));const years=[...new Set((r.data||[]).map(x=>x.fiscal_year))].sort((a,b)=>b-a);$('yearFilter').innerHTML='<option value="all">ทุกปี</option>'+years.map(y=>`<option value="${y}">${y}</option>`).join('')}$('yearFilter').onchange=loadReport;window.saveShare=async()=>{if(!member)return;const iso=thaiToISO($('date').value),buy=Number($('buy').value||0),sell=Number($('sell').value||0);if(!iso){Swal.fire('วันที่ไม่ถูกต้อง','ใช้รูปแบบ วัน/เดือน/พ.ศ.','warning');return}if(!buy&&!sell){Swal.fire('กรุณาใส่ยอดซื้อหรือขาย','','warning');return}const fiscal=fy(iso);const ins=await sb.from('member_share_tx').insert({member_id:Number(member.member_id),trans_date:iso,fiscal_year:fiscal,share_buy:buy,share_sell:sell}).select().single();if(ins.error){Swal.fire('บันทึกไม่สำเร็จ',ins.error.message,'error');return}const old=await sb.from('member_share').select('*').eq('member_id',Number(member.member_id)).eq('fiscal_year',fiscal).maybeSingle();if(old.data){const nb=Number(old.data.share_buy||0)+buy,ns=Number(old.data.share_sell||0)+sell,bal=Number(old.data.share_begin||0)+nb-ns;await sb.from('member_share').update({share_buy:nb,share_sell:ns,share_balance:bal}).eq('id',old.data.id)}else{const last=await sb.from('member_share').select('share_balance').eq('member_id',Number(member.member_id)).eq('fiscal_year',fiscal-1).maybeSingle();const begin=Number(last.data?.share_balance||0);await sb.from('member_share').insert({member_id:Number(member.member_id),fiscal_year:fiscal,share_begin:begin,share_buy:buy,share_sell:sell,share_balance:begin+buy-sell})}Swal.fire({icon:'success',title:'บันทึกสำเร็จ',timer:1200,showConfirmButton:false});$('buy').value='';$('sell').value='';loadYearFilter();loadReport();if($('dailyDate').value===iso)loadDaily()};async function loadReport(){if(!member){$('reportBox').innerHTML='<div class="mobile-empty">กรุณาเลือกสมาชิก</div>';return}let q=sb.from('member_share_tx').select('*').eq('member_id',Number(member.member_id)).order('trans_date',{ascending:false});if($('yearFilter').value!=='all')q=q.eq('fiscal_year',Number($('yearFilter').value));const r=await q;const rows=r.data||[];$('reportBox').innerHTML=rows.length?rows.map(x=>`<div class="report-row"><div class="report-kv"><span>วันที่</span><b>${isoToThai(x.trans_date)}</b></div><div class="report-kv"><span>ปีบัญชี</span><span>${x.fiscal_year}</span></div><div class="report-kv"><span>ซื้อ</span><span class="amount-pos">${money(x.share_buy)} บาท</span></div><div class="report-kv"><span>ขาย</span><span class="amount-neg">${money(x.share_sell)} บาท</span></div></div>`).join(''):'<div class="mobile-empty">ไม่มีรายการ</div>'}$('dailyDate').onchange=loadDaily;async function loadDaily(){const date=$('dailyDate').value;if(!date){$('dailyReport').innerHTML='';return}const r=await sb.from('member_share_tx').select('id,member_id,share_buy,share_sell,members(title,first_name,last_name,group)').eq('trans_date',date);const rows=r.data||[];let total=0;$('dailyReport').innerHTML=rows.length?rows.map(x=>{total+=Number(x.share_buy||0);return `<div class="report-row"><div class="report-kv"><span>รหัส</span><b>${x.member_id}</b></div><div class="report-kv"><span>ชื่อ</span><span>${x.members?.title||''}${x.members?.first_name||''} ${x.members?.last_name||''}</span></div><div class="report-kv"><span>กลุ่ม</span><span>${x.members?.group||'-'}</span></div><div class="report-kv"><span>ซื้อ</span><span class="amount-pos">${money(x.share_buy)} บาท</span></div></div>`}).join('')+`<div class="report-row"><b>รวมซื้อ ${money(total)} บาท</b></div>`:'<div class="mobile-empty">ไม่มีรายการ</div>'};</script></body></html>
